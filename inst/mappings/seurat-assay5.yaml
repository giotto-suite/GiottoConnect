# Seurat (SeuratObject >= 5) with an Assay5 count assay -> Giotto.
# Spatial parts come from an FOV image (Xenium, CosMx, MERSCOPE loaders).
# Coordinates follow the Giotto convention: sdimx = x, sdimy = -y.
mapping:
  id: seurat-assay5
  version: 0.1.0
  status: verified
  built: "2026-11-23"
  schema_version: 0.1.0
  source:
    ecosystem: seurat
    class: Seurat
    package: SeuratObject
    built_with: "5.4.0"
    applies_to:
      package_version: ">= 5.0.0"
      predicates:
        - { path: "assays/{assay}", class: Assay5 }
  target: { contract: giotto, version: "0.7.31" }
  fingerprint: "8b420c04c2c4215c"
  fixtures: [seurat5_fixture_small]
  history: []

params:
  assay:      { list: Assays, rule: value_of, path: active.assay, where: { class: Assay5 } }
  layer_raw:  { list: Layers, on: "{assay}", rule: first_where, where: { role: [integer_valued, nonneg] } }
  layer_norm: { list: Layers, on: "{assay}", rule: name_is, value: data, optional: true }
  fov:        { list: Images, rule: first_of_class, class: FOV, optional: true }
  centroids:  { list: Boundaries, on: "{fov}", rule: first_of_class, class: Centroids, optional: true }
  segmentation: { list: Boundaries, on: "{fov}", rule: first_of_class, class: Segmentation, optional: true }
  molecules:  { list: Molecules, on: "{fov}", rule: first_of_class, class: Molecules, optional: true }
  nn_graph:   { list: Graphs, rule: first_where, where: { name_matches: "_nn$", or_role: binary_valued }, optional: true }

source_nodes:
  counts:       { path: "assays/{assay}/layers/{layer_raw}",
                  get: { fn: LayerData, args: { assay: "{assay}", layer: "{layer_raw}" } } }
  normalized:   { path: "assays/{assay}/layers/{layer_norm}",
                  get: { fn: LayerData, args: { assay: "{assay}", layer: "{layer_norm}" } } }
  cell_meta:    { path: "meta.data", get: { fn: "[[" } }
  feat_meta:    { path: "assays/{assay}/meta.data", get: { fn: "[[", on: "assays/{assay}" } }
  centroids:    { path: "images/{fov}/boundaries/{centroids}",
                  get: { fn: GetTissueCoordinates, on: "images/{fov}/boundaries/{centroids}" } }
  segmentation: { path: "images/{fov}/boundaries/{segmentation}",
                  get: { fn: GetTissueCoordinates, on: "images/{fov}/boundaries/{segmentation}" } }
  molecules:    { path: "images/{fov}/molecules/{molecules}",
                  get: { fn: GetTissueCoordinates, on: "images/{fov}/molecules/{molecules}" } }
  reduction:  { path: "reductions/{red}/cell.embeddings", get: { fn: Embeddings, args: { reduction: "{red}" } } }
  nn:           { path: "graphs/{nn_graph}", get: { fn: "[[", args: { i: "{nn_graph}" } } }
  other_graph: { path: "graphs/{g}", get: { fn: "[[", args: { i: "{g}" } } }
  spatial_reduction: { path: "reductions/{coord_red}/cell.embeddings", get: { fn: Embeddings, args: { reduction: "{coord_red}" } } }
  # assays other than the main one (control probes, protein, ...)
  extra_counts:       { path: "assays/{extra}/layers/counts", get: { fn: LayerData, args: { assay: "{extra}", layer: counts } } }
  extra_counts_v3:    { path: "assays/{extra}/counts", get: { fn: LayerData, args: { assay: "{extra}", layer: counts } } }
  extra_data:         { path: "assays/{extra}/layers/data", get: { fn: LayerData, args: { assay: "{extra}", layer: data } } }
  extra_data_v3:      { path: "assays/{extra}/data", get: { fn: LayerData, args: { assay: "{extra}", layer: data } } }
  extra_feat_meta:    { path: "assays/{extra}/meta.data", get: { fn: "[[", on: "assays/{extra}" } }
  extra_feat_meta_v3: { path: "assays/{extra}/meta.features", get: { fn: "[[", on: "assays/{extra}" } }

parts:
  - id: expr_raw
    part: expression
    from: counts
    to: { spat_unit: cell, feat_type: rna, name: raw }

  - id: expr_normalized
    part: expression
    from: normalized
    optional: true
    to: { spat_unit: cell, feat_type: rna, name: normalized }

  - id: cell_meta
    part: cell_metadata
    from: cell_meta
    ops:
      - { op: rownames_to_col, col: cell_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: feat_meta
    part: feat_metadata
    from: feat_meta
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: locs
    part: spatial_locs
    from: centroids
    optional: true
    ops:
      - { op: rename, map: { x: sdimx, y: sdimy, cell: cell_ID } }
      - { op: scale, factor: -1, cols: [sdimy] }
    to: { spat_unit: cell, name: raw }
    lossy:
      - { kind: estimated, field: units, note: "FOV coordinates carry no unit; assumed micron" }
    alternatives:
      # coordinates kept as cell metadata columns instead of an FOV
      - id: locs_from_meta
        from: cell_meta
        params:
          x_col: { list: columns, on: meta.data, rule: first_where, where: { name_matches: "^(x|.*_x)([_.].*)?$|^x$", kind: vector } }
          y_col: { list: columns, on: meta.data, rule: first_where, where: { name_matches: "^(y|.*_y)([_.].*)?$|^y$", kind: vector } }
        ops:
          - { op: select_cols, cols: ["{x_col}", "{y_col}"] }
          - { op: rownames_to_col, col: cell_ID }
          - { op: rename, map: { "{x_col}": sdimx, "{y_col}": sdimy } }
          - { op: scale, factor: -1, cols: [sdimy] }
        lossy:
          - { kind: estimated, field: units, note: "metadata coordinates carry no unit; assumed micron" }
          - { kind: ambiguous, field: orientation, note: "metadata coordinates assumed image-space (y down), like FOV" }
      # coordinates kept as a 2-d reduction (e.g. one named "spatial")
      - id: locs_from_reduction
        from: spatial_reduction
        params:
          coord_red: { list: Reductions, rule: first_where, where: { name_matches: "^(spatial|coords?|centroids?|xy)$" } }
        ops:
          - { op: cast, to: table }
          - { op: set_colnames, cols: [sdimx, sdimy] }
          - { op: rownames_to_col, col: cell_ID }
          - { op: scale, factor: -1, cols: [sdimy] }
        lossy:
          - { kind: estimated, field: units, note: "reduction coordinates carry no unit; assumed micron" }
          - { kind: ambiguous, field: orientation, note: "reduction coordinates assumed image-space (y down), like FOV" }

  - id: polygons
    part: spatial_info
    from: segmentation
    optional: true
    ops:
      - { op: rename, map: { cell: poly_ID } }
      - { op: scale, factor: -1, cols: [y] }
    to: { name: cell }
    lossy:
      - { kind: estimated, field: geometry, note: "invalid source rings are repaired (make_valid); their vertices can move" }

  # transcripts; control transcripts go to the control feature types (Seurat
  # names features with "-" where the transcript names have "_")
  - id: points
    part: feature_info
    from: molecules
    optional: true
    ops:
      - { op: rename, map: { molecule: feat_ID } }
      - { op: replace, cols: [feat_ID], pattern: "_", replacement: "-" }
      - { op: scale, factor: -1, cols: [y] }
    to: { feat_type: [rna, NegControlProbe, UnassignedCodeword, NegControlCodeword, GenomicControl, negprobes],
          split_keyword: [NegControlProbe, UnassignedCodeword, NegControlCodeword, GenomicControl, NegPrb] }
    lossy:
      - { kind: estimated, field: units, note: "FOV coordinates carry no unit; assumed micron" }

  # one dim_reduction per reduction in the object (coordinate-like ones are
  # read by the locs alternatives instead)
  - id: "dimred_{red}"
    part: dim_reduction
    from: reduction
    for_each: { list: Reductions, as: red, exclude: "^(spatial|coords?|centroids?|xy)$" }
    # loadings and stdev^2 go to the misc as runPCA stores them
    hook: seurat_reduction_misc
    to: { spat_unit: cell, feat_type: rna, name: "{red}", method: "{red}" }

  - id: nn
    part: nn_network
    from: nn
    hook: seurat_graph_to_nn
    optional: true
    # the hook sets nn_type (kNN if binary) and names it <type>.<reduction>
    # from Seurat's FindNeighbors record, else keeps the graph name
    to: { spat_unit: cell, feat_type: rna, nn_type: kNN, name: "{nn_graph}" }

  # every other graph (e.g. those giottoToSeurat() writes), by name
  - id: "nn_{g}"
    part: nn_network
    from: other_graph
    hook: seurat_graph_to_nn
    for_each: { list: Graphs, as: g, exclude: "^({nn_graph}|{assay}_snn)$" }
    to: { spat_unit: cell, feat_type: rna, nn_type: kNN, name: "{g}" }

  # every other assay is its own feature type; Xenium/Atera controls take
  # the names Giotto's readers use
  - id: "expr_{extra_label}"
    part: expression
    from: extra_counts
    for_each: &other_assays
      list: Assays
      as: extra
      exclude: "^{assay}$"
      where: { class: Assay5 }
      rename: { ControlProbe: NegControlProbe, ControlCodeword: NegControlCodeword,
                BlankCodeword: UnassignedCodeword, ADT: protein }
    to: { spat_unit: cell, feat_type: "{extra_label}", name: raw }

  - id: "expr_norm_{extra_label}"
    part: expression
    from: extra_data
    for_each: *other_assays
    to: { spat_unit: cell, feat_type: "{extra_label}", name: normalized }

  - id: "feat_meta_{extra_label}"
    part: feat_metadata
    from: extra_feat_meta
    for_each: *other_assays
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: "{extra_label}" }

  - id: "expr_v3_{extra_label}"
    part: expression
    from: extra_counts_v3
    for_each: &other_assays_v3
      list: Assays
      as: extra
      exclude: "^{assay}$"
      where: { class: Assay }
      rename: { ControlProbe: NegControlProbe, ControlCodeword: NegControlCodeword,
                BlankCodeword: UnassignedCodeword, ADT: protein }
    to: { spat_unit: cell, feat_type: "{extra_label}", name: raw }

  - id: "expr_norm_v3_{extra_label}"
    part: expression
    from: extra_data_v3
    for_each: *other_assays_v3
    to: { spat_unit: cell, feat_type: "{extra_label}", name: normalized }

  - id: "feat_meta_v3_{extra_label}"
    part: feat_metadata
    from: extra_feat_meta_v3
    for_each: *other_assays_v3
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: "{extra_label}" }

lossy:
  - { kind: dropped, path: "misc/giottoConnect", note: "record of the conversion that wrote this object" }
  - { kind: dropped, path: "assays/{assay}/layers/scale.data", note: "recomputable from normalized values; no Giotto slot" }
  - { kind: dropped, path: "graphs/{assay}_snn", note: "only the kNN graph is mapped; sNN can be rebuilt with createNearestNetwork()" }
