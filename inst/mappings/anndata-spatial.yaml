# AnnData (.h5ad, scanpy / squidpy layout) -> Giotto.
# Counts are the first integer matrix among X, layers/* and raw/X; X is
# mapped as normalized values when it is not integer. Coordinates come from
# obsm/spatial (or X_spatial), else from obs columns.
# With var/feature_types (10x), Gene Expression is the rna feature type and
# every other category its own feature type.
# Coordinates follow the Giotto convention: sdimx = x, sdimy = -y.
mapping:
  id: anndata-spatial
  version: 0.1.0
  status: verified
  built: "2026-11-23"
  schema_version: 0.1.0
  source:
    ecosystem: anndata
    class: AnnData
    package: anndata
    applies_to:
      predicates:
        - { path: obs, kind: data.frame }
        - { path: var, kind: data.frame }
  target: { contract: giotto, version: "0.7.31" }
  fingerprint: "9961c0994f399ad6"
  fixtures: [anndata_fixture]
  history: []

params:
  counts:     { list: Matrices, rule: first_where, as: path, optional: true,
                where: { kind: [sparse_matrix, dense_matrix], role: [integer_valued, nonneg, rows_eq_ncells] } }
  normalized: { list: Matrices, on: "", rule: first_where, as: path, optional: true,
                where: { name_matches: "^X$", kind: [sparse_matrix, dense_matrix], not_role: [integer_valued] } }
  spatial:    { list: Obsm, rule: first_where, where: { name_matches: "^(X_)?spatial$", kind: dense_matrix }, optional: true }
  rna_type:   { list: FeatureTypes, rule: name_is, value: "Gene Expression", optional: true }

source_nodes:
  counts:     { path: "{counts}", get: { fn: h5adMatrix, args: { feature_type: "{rna_type}" } } }
  normalized: { path: "{normalized}", get: { fn: h5adMatrix, args: { feature_type: "{rna_type}" } } }
  obs:        { path: obs, get: { fn: h5adFrame } }
  # the feature table of the counts: raw/var (plus var columns) for raw/X
  var:        { path: var, get: { fn: h5adVar, args: { matrix: "{counts}", feature_type: "{rna_type}" } } }
  # one var/feature_types category
  ft_counts:     { path: "{counts}", get: { fn: h5adMatrix, args: { feature_type: "{ft}" } } }
  ft_normalized: { path: "{normalized}", get: { fn: h5adMatrix, args: { feature_type: "{ft}" } } }
  ft_var:        { path: var, get: { fn: h5adVar, args: { matrix: "{counts}", feature_type: "{ft}" } } }
  spatial:    { path: "obsm/{spatial}", get: { fn: h5adObsm } }
  reduction:  { path: "obsm/{red}", get: { fn: h5adObsm } }
  nn:         { path: "obsp/{nnk}", get: { fn: h5adObsp } }
  spatial_net: { path: "obsp/{snk}", get: { fn: h5adObsp } }
  other_layer: { path: "layers/{lay}", get: { fn: h5adMatrix, args: { feature_type: "{rna_type}" } } }

parts:
  - id: expr_raw
    part: expression
    from: counts
    optional: true
    to: { spat_unit: cell, feat_type: rna, name: raw }

  - id: expr_normalized
    part: expression
    from: normalized
    optional: true
    to: { spat_unit: cell, feat_type: rna, name: normalized }
    lossy:
      - { kind: ambiguous, field: transform, note: "X holds whatever scanpy left there (normalized, log1p and/or scaled); mapped as normalized" }

  - id: cell_meta
    part: cell_metadata
    from: obs
    ops:
      - { op: rownames_to_col, col: cell_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: feat_meta
    part: feat_metadata
    from: var
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: locs
    part: spatial_locs
    from: spatial
    optional: true
    ops:
      - { op: cast, to: table }
      - { op: select_cols, cols: [Dim.1, Dim.2] }
      - { op: set_colnames, cols: [sdimx, sdimy] }
      - { op: rownames_to_col, col: cell_ID }
      - { op: scale, factor: -1, cols: [sdimy] }
    to: { spat_unit: cell, name: raw }
    lossy:
      - { kind: estimated, field: units, note: "obsm coordinates carry no unit (Visium: full-resolution pixels); kept as stored" }
      - { kind: ambiguous, field: orientation, note: "obsm coordinates assumed image-space (y down), as scanpy/squidpy plot them" }
    alternatives:
      # coordinates kept as obs columns
      - id: locs_from_obs
        from: obs
        params:
          x_col: { list: columns, on: obs, rule: first_where, where: { name_matches: "^(x|.*_x)([_.].*)?$|^x$", kind: vector } }
          y_col: { list: columns, on: obs, rule: first_where, where: { name_matches: "^(y|.*_y)([_.].*)?$|^y$", kind: vector } }
        ops:
          - { op: select_cols, cols: ["{x_col}", "{y_col}"] }
          - { op: rownames_to_col, col: cell_ID }
          - { op: rename, map: { "{x_col}": sdimx, "{y_col}": sdimy } }
          - { op: scale, factor: -1, cols: [sdimy] }
        lossy:
          - { kind: estimated, field: units, note: "obs coordinates carry no unit; kept as stored" }
          - { kind: ambiguous, field: orientation, note: "obs coordinates assumed image-space (y down)" }

  # one dim_reduction per obsm embedding (X_pca -> pca); coordinates are
  # read by locs instead
  - id: "dimred_{red_label}"
    part: dim_reduction
    from: reduction
    for_each: { list: Obsm, as: red, strip: "^X_", exclude: "spatial", where: { kind: dense_matrix } }
    # X_pca: loadings (varm/PCs) and eigenvalues (uns/pca/variance) go to the misc
    hook: anndata_pca_misc
    to: { spat_unit: cell, feat_type: rna, name: "{red_label}", method: "{red_label}" }

  # every other var/feature_types category is its own feature type, named as
  # Giotto's readers name them
  - id: "expr_{ft_label}"
    part: expression
    from: ft_counts
    for_each: &other_types
      list: FeatureTypes
      as: ft
      exclude: "^Gene Expression$"
      rename: { "Antibody Capture": protein, "Negative Control Probe": NegControlProbe,
                "Negative Control Codeword": NegControlCodeword,
                "Unassigned Codeword": UnassignedCodeword, "Blank Codeword": UnassignedCodeword,
                "Genomic Control": GenomicControl }
    to: { spat_unit: cell, feat_type: "{ft_label}", name: raw }

  - id: "expr_norm_{ft_label}"
    part: expression
    from: ft_normalized
    for_each: *other_types
    to: { spat_unit: cell, feat_type: "{ft_label}", name: normalized }

  - id: "feat_meta_{ft_label}"
    part: feat_metadata
    from: ft_var
    for_each: *other_types
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: "{ft_label}" }

  # every kNN distances matrix (scanpy neighbors, also with key_added); the
  # hook names it kNN.<space> from its uns record, or takes the Giotto name
  # and type a giottoToAnnData() record holds
  - id: "nn_{nnk}"
    part: nn_network
    from: nn
    hook: anndata_distances_to_nn
    for_each: { list: Obsp, as: nnk, where: { name_matches: "distances$" }, exclude: "spatial" }
    to: { spat_unit: cell, feat_type: rna, nn_type: kNN, name: "{nnk}" }

  # squidpy spatial graphs -> Giotto spatial networks (kNN_network /
  # Delaunay_network from their spatial_neighbors record, or the Giotto name)
  - id: "spatial_network_{snk}"
    part: spatial_network
    from: spatial_net
    hook: anndata_spatial_network
    for_each: { list: Obsp, as: snk, where: { name_matches: "spatial.*connectivities$" } }
    to: { spat_unit: cell, name: "{snk}" }

  # other layers (e.g. scaled) as expression values of the same name
  - id: "expr_layer_{lay}"
    part: expression
    from: other_layer
    for_each: { list: Layers, as: lay, exclude: "^(counts|raw|raw_counts)$" }
    to: { spat_unit: cell, feat_type: rna, name: "{lay}" }

lossy:
  - { kind: dropped, path: "obsp/connectivities", note: "UMAP connectivities; Giotto weights come from distances" }
  - { kind: dropped, path: "uns", note: "unstructured annotations (colours, parameters) are not mapped" }
