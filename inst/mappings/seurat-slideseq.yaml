# Seurat with a SlideSeq image (ReadSlideSeq / LoadSlideSeq) -> Giotto.
# Works with v3 Assay and Assay5. Bead coordinates are taken as given (no unit
# conversion) and follow sdimx = x, sdimy = -y.
mapping:
  id: seurat-slideseq
  version: 0.1.0
  status: verified
  built: "2026-11-20"
  schema_version: 0.1.0
  source:
    ecosystem: seurat
    class: Seurat
    package: SeuratObject
    built_with: "5.4.0"
    applies_to:
      predicates:
        - { path: "images/{image}", class: SlideSeq }
  target: { contract: giotto, version: "0.7.31" }
  fingerprint: "425d6c70639ec4d1"
  fixtures: [seurat_slideseq_fixture]
  history: []

params:
  assay:      { list: Assays, rule: value_of, path: active.assay, where: { class: [Assay5, Assay] } }
  layer_raw:  { list: AssayLayers, on: "{assay}", rule: first_where, where: { kind: sparse_matrix, role: [integer_valued, nonneg] } }
  layer_norm: { list: AssayLayers, on: "{assay}", rule: name_is, value: data, optional: true }
  image:      { list: Images, rule: first_of_class, class: SlideSeq }
  nn_graph:   { list: Graphs, rule: first_where, where: { name_matches: "_nn$", or_role: binary_valued }, optional: true }

source_nodes:
  # the assay node is the structural anchor: v3 assays keep layers as slots,
  # Assay5 under layers/; LayerData reads both
  counts:     { path: "assays/{assay}", get: { fn: LayerData, args: { assay: "{assay}", layer: "{layer_raw}" } } }
  normalized: { path: "assays/{assay}", get: { fn: LayerData, args: { assay: "{assay}", layer: "{layer_norm}" } } }
  cell_meta:  { path: "meta.data", get: { fn: "[[" } }
  feat_meta:  { path: "assays/{assay}", get: { fn: "[[", on: "assays/{assay}" } }
  beads:      { path: "images/{image}/coordinates", get: { fn: GetTissueCoordinates, on: "images/{image}" } }
  reduction:  { path: "reductions/{red}/cell.embeddings", get: { fn: Embeddings, args: { reduction: "{red}" } } }
  nn:         { path: "graphs/{nn_graph}", get: { fn: "[[", args: { i: "{nn_graph}" } } }
  # assays other than the main one (control probes, protein, ...)
  extra_counts:       { path: "assays/{extra}/layers/counts", get: { fn: LayerData, args: { assay: "{extra}", layer: counts } } }
  extra_counts_v3:    { path: "assays/{extra}/counts", get: { fn: LayerData, args: { assay: "{extra}", layer: counts } } }
  extra_data:         { path: "assays/{extra}/layers/data", get: { fn: LayerData, args: { assay: "{extra}", layer: data } } }
  extra_data_v3:      { path: "assays/{extra}/data", get: { fn: LayerData, args: { assay: "{extra}", layer: data } } }
  extra_feat_meta:    { path: "assays/{extra}/meta.data", get: { fn: "[[", on: "assays/{extra}" } }
  extra_feat_meta_v3: { path: "assays/{extra}/meta.features", get: { fn: "[[", on: "assays/{extra}" } }

parts:
  - id: expr_raw
    part: expression
    from: counts
    to: { spat_unit: cell, feat_type: rna, name: raw }

  - id: expr_normalized
    part: expression
    from: normalized
    optional: true
    to: { spat_unit: cell, feat_type: rna, name: normalized }

  - id: cell_meta
    part: cell_metadata
    from: cell_meta
    ops:
      - { op: rownames_to_col, col: cell_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: feat_meta
    part: feat_metadata
    from: feat_meta
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: rna }

  - id: locs
    part: spatial_locs
    from: beads
    ops:
      # GetTissueCoordinates(SlideSeq) adds an unnamed copy of the cell ids
      - { op: select_cols, cols: [x, y, cells] }
      - { op: rename, map: { x: sdimx, y: sdimy, cells: cell_ID } }
      - { op: scale, factor: -1, cols: [sdimy] }
    to: { spat_unit: cell, name: raw }
    lossy:
      - { kind: estimated, field: units, note: "bead coordinates are kept in their own units (puck pixels or microns, as loaded)" }
      - { kind: ambiguous, field: orientation, note: "bead coordinates assumed image-space (y down), like FOV" }

  - id: "dimred_{red}"
    part: dim_reduction
    from: reduction
    for_each: { list: Reductions, as: red, exclude: "^(spatial|coords?|centroids?|xy)$" }
    # loadings and stdev^2 go to the misc as runPCA stores them
    hook: seurat_reduction_misc
    to: { spat_unit: cell, feat_type: rna, name: "{red}", method: "{red}" }

  - id: nn
    part: nn_network
    from: nn
    hook: seurat_graph_to_nn
    optional: true
    to: { spat_unit: cell, feat_type: rna, nn_type: kNN, name: "{nn_graph}" }

  # every other assay is its own feature type; Xenium/Atera controls take
  # the names Giotto's readers use
  - id: "expr_{extra_label}"
    part: expression
    from: extra_counts
    for_each: &other_assays
      list: Assays
      as: extra
      exclude: "^{assay}$"
      where: { class: Assay5 }
      rename: { ControlProbe: NegControlProbe, ControlCodeword: NegControlCodeword,
                BlankCodeword: UnassignedCodeword, ADT: protein }
    to: { spat_unit: cell, feat_type: "{extra_label}", name: raw }

  - id: "expr_norm_{extra_label}"
    part: expression
    from: extra_data
    for_each: *other_assays
    to: { spat_unit: cell, feat_type: "{extra_label}", name: normalized }

  - id: "feat_meta_{extra_label}"
    part: feat_metadata
    from: extra_feat_meta
    for_each: *other_assays
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: "{extra_label}" }

  - id: "expr_v3_{extra_label}"
    part: expression
    from: extra_counts_v3
    for_each: &other_assays_v3
      list: Assays
      as: extra
      exclude: "^{assay}$"
      where: { class: Assay }
      rename: { ControlProbe: NegControlProbe, ControlCodeword: NegControlCodeword,
                BlankCodeword: UnassignedCodeword, ADT: protein }
    to: { spat_unit: cell, feat_type: "{extra_label}", name: raw }

  - id: "expr_norm_v3_{extra_label}"
    part: expression
    from: extra_data_v3
    for_each: *other_assays_v3
    to: { spat_unit: cell, feat_type: "{extra_label}", name: normalized }

  - id: "feat_meta_v3_{extra_label}"
    part: feat_metadata
    from: extra_feat_meta_v3
    for_each: *other_assays_v3
    ops:
      - { op: rownames_to_col, col: feat_ID }
    to: { spat_unit: cell, feat_type: "{extra_label}" }

lossy:
  - { kind: dropped, path: "assays/{assay}/scale.data", note: "recomputable from normalized values; no Giotto slot" }
  - { kind: dropped, path: "assays/{assay}/layers/scale.data", note: "recomputable from normalized values; no Giotto slot" }
  - { kind: dropped, path: "graphs/{assay}_snn", note: "only the kNN graph is mapped; sNN can be rebuilt with createNearestNetwork()" }
