<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>GiottoConnect links the giotto object to other ecosystems, other software and external tools</title>
  <g fill="none" stroke="#7E69AE" stroke-width="2">
    <path d="M200 66 C 225 66, 230 110, 250 120"/>
    <path d="M200 234 C 225 234, 230 190, 250 180"/>
    <path d="M410 150 L 440 150"/>
  </g>
  <rect x="230" y="110" width="180" height="80" rx="10" fill="#E9E4F3" stroke="#7E69AE" stroke-width="1.5"/>
  <rect x="10" y="20" width="190" height="92" rx="8" fill="#F7F6FA" stroke="#B9AFD3"/>
  <rect x="10" y="188" width="190" height="92" rx="8" fill="#F7F6FA" stroke="#B9AFD3"/>
  <rect x="440" y="104" width="190" height="92" rx="8" fill="#F7F6FA" stroke="#B9AFD3"/>
  <g fill="#2A2438" text-anchor="middle">
    <g font-size="15" font-weight="600">
      <text x="320" y="143">Giotto Suite</text>
      <text x="105" y="46">1. Other ecosystems</text>
      <text x="105" y="214">2. Other software</text>
      <text x="535" y="130">3. External tools</text>
    </g>
    <g font-size="12.5" fill="#4A4258">
      <text x="320" y="163">giotto object, in memory</text>
      <text x="320" y="179">or on disk (GiottoDisk)</text>
      <text x="105" y="68">Seurat, AnnData,</text>
      <text x="105" y="84">SpatialExperiment / SFE,</text>
      <text x="105" y="100">SpatialData</text>
      <text x="105" y="236">files other tools read:</text>
      <text x="105" y="252">.h5ad, SpatialExperiment,</text>
      <text x="105" y="268">Bento</text>
      <text x="535" y="152">Banksy, BayesSpace,</text>
      <text x="535" y="168">CellChat, nnSVG,</text>
      <text x="535" y="184">ONTraC</text>
    </g>
  </g>
</svg>
